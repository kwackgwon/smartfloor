<p style="font:13px sans-serif">SmartFloor 웹에서 <b>JSON</b> 으로 내보낸 smartfloor.json 내용을 붙여넣으세요.</p>
<textarea id="j" style="width:100%;height:200px"></textarea>
<button id="go">Figma 로 가져오기</button>
<script>
  document.getElementById('go').onclick = () => {
    try {
      parent.postMessage({ pluginMessage: JSON.parse(document.getElementById('j').value) }, '*');
    } catch (e) { alert('JSON 형식이 올바르지 않습니다'); }
  };
</script>
