<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SmartFloor</title>
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand">
        <span class="logo">S</span>
        <div>
          <h1>SmartFloor</h1>
          <p>도면 이미지 → 벽 도면</p>
        </div>
      </div>
      <span id="msg" class="chip">도면 이미지를 올려 주세요</span>
    </div>
  </header>

  <main class="wrap">
    <form id="form" class="card panel">
      <section class="step">
        <h2><span class="num">1</span>도면 이미지</h2>
        <label id="drop" class="drop" for="file">
          <img id="preview" alt="" hidden>
          <span id="drop-text"><strong>끌어다 놓거나 클릭해서 선택</strong><br>PNG · JPG · WEBP, 10MB 이하</span>
        </label>
        <input type="file" id="file" accept=".png,.jpg,.jpeg,.webp" hidden>
        <p class="note" id="drop-note" hidden>다른 도면을 쓰려면 이미지를 다시 올리세요</p>
      </section>

      <section class="step">
        <h2><span class="num">2</span>요청 사항 <small>선택</small></h2>
        <textarea name="note" rows="2" placeholder="예) 오른쪽 아래 창고 벽은 빼 주세요"></textarea>
      </section>

      <button class="primary big" id="gen">Gemini로 도면 생성</button>

      <details id="settings" class="settings">
        <summary><span>Gemini 설정</span><span id="key-state" class="state">API 키 필요</span></summary>
        <label><span>API 키 · <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">발급받기 ↗</a></span>
          <input id="key" type="password" autocomplete="off" placeholder="AIza...">
        </label>
        <label>모델 <small>키를 넣으면 최신 모델 자동 선택</small><input id="model" list="models" value="gemini-3.8-flash"></label>
        <datalist id="models"></datalist>
      </details>
    </form>

    <section class="card view">
      <div class="toolbar">
        <span class="hint" id="hint">도면 위를 드래그하면 벽을 추가합니다 · Shift = 사선</span>
        <div class="grp">
          <button type="button" class="ghost" id="png">PNG</button>
          <button type="button" class="ghost" id="export">JSON</button>
          <button type="button" class="primary" id="save">저장</button>
        </div>
      </div>
      <div class="stage" id="stage">
        <div id="empty" class="empty">
          <b>아직 도면이 없습니다</b>
          왼쪽에 도면 이미지를 올린 뒤 <b>Gemini로 도면 생성</b>을 누르세요.
        </div>
        <div id="loading" class="empty" hidden><span class="spin"></span><span id="loading-text">Gemini가 도면을 그리는 중…</span></div>
        <canvas id="c" hidden></canvas>
      </div>
    </section>
  </main>

  <!-- ?v= 는 배포할 때마다 올린다 (브라우저가 예전 파일을 쓰지 않게) -->
  <script src="gemini.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
